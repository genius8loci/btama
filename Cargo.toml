[package]
name = "btama"
version = "0.1.5"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Готовый DX9-оверлей с ImGui: избавляет от собственного хука EndScene.
#
# Не ниже 0.8: в 0.7.1 вершинный буфер DX9 создавался размером
# `capacity * size_of::<DrawVert>()` (20 байт), а заполнялся структурами
# `CustomVertex` по 24 байта. Как только число вершин переваливало за пять
# шестых ёмкости буфера, `Lock` возвращал ошибку и кадр не рисовался вовсе —
# оверлей мигал и пропадал при прокрутке длинных списков.
hudhook = { version = "0.9", features = ["dx9"] }
imgui = "0.12"
minhook-sys = "0.1"

# Перечисляем ровно те фичи, которые используем сами. Раньше часть вызовов
# (VirtualQuery, GetAsyncKeyState) компилировалась только потому, что нужные
# фичи включал hudhook, а Cargo их объединял — при смене его версии сборка
# развалилась бы без единой правки в нашем коде.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",  # OutputDebugStringW
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",             # VirtualQuery и константы защиты страниц
    "Win32_System_SystemInformation",  # GetLocalTime для меток времени в логе
    "Win32_System_SystemServices",     # DLL_PROCESS_ATTACH / DETACH
    "Win32_System_Threading",          # GetCurrentProcessId
    "Win32_UI_Input_KeyboardAndMouse", # GetAsyncKeyState
    "Win32_UI_WindowsAndMessaging",    # GetForegroundWindow
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# panic = "abort" здесь недопустим: паника обязана быть перехвачена и
# залогирована, а не убивать чужой процесс. См. catch_unwind в overlay.rs.
panic = "unwind"